dataset:
  name: kitti
  root: /HDD/KITTI/odometry/dataset
  sequence: "00"

# Front-end (swappable): LiDAR odometry
frontend:
  name: kiss_icp
  max_range: 100.0
  min_range: 0.0
  deskew: false          # KITTI odometry scans are already motion-compensated

# Descriptor used by MSA (feature space) and by place recognition
descriptor:
  name: overlap_transformer
  weights: weights/pretrained_overlap_transformer.pth.tar
  device: cpu            # ~60 ms/scan on CPU; use cuda if the GPU has ~1 GB free

# Keyframe sampling (fixed): official opt-key implementations
sampling:
  methods: [all, msa, fixed_1, fixed_2, entropy, spaciousness]  # all = w/o MSA
  msa:                   # same arguments as opt-key examples/pr_example.py
    window_size: 10
    n_neighbours: 2
    alpha: 1.0
    beta: 1.0

# Back-end (swappable): place recognition -> verification -> PGO
backend:
  name: loop_closure_isam2
  sim_threshold: 0.7     # OverlapTransformer similarity 1/(1+L2) needed to try a loop
  top_k: 3
  min_frame_gap: 100     # ignore the last 100 frames (~10 s) as loop candidates
  coarse_voxel: 1.0
  fine_voxel: 0.5
  coarse_max_corr: 3.0
  fine_max_corr: 1.0
  min_inlier_ratio: 0.5  # small_gicp inliers / source points to accept a loop
  max_estimate_distance: 30.0  # metres: skip candidates this far from the current estimate
  num_threads: 8
  odom_sigmas: [0.01, 0.1]   # [rad, m]
  loop_sigmas: [0.05, 0.3]
  cauchy_k: 1.0

eval:
  delta: 3.0             # metres: a place-recognition match is a true positive within this distance

output: results
